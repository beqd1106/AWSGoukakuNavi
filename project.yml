name: AWSGoukakuNavi
options:
  bundleIdPrefix: com.beqd1106
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"           # App Storeに表示されるバージョン
    CURRENT_PROJECT_VERSION: "1"         # ビルド番号（CIで自動上書き）
    VERSIONING_SYSTEM: apple-generic     # agvtoolでビルド番号を更新できるように
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: ja
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"          # iPhone専用
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: AWSnote

targets:
  AWSGoukakuNavi:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Logic
      - DesignSystem
      - Views
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.awsgoukakunavi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  AWSGoukakuNaviTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AWSGoukakuNavi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.awsgoukakunavi.tests
